<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>zdrive</title><style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}canvas{display:block;width:100%;height:100%;object-fit:contain;background:#000;outline:0}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;color:#eee;background:rgba(0,0,0,.72);text-align:center;cursor:pointer}#overlay.hidden{display:none}#title{font-size:1.15em;font-weight:600}#hint{font-size:.9em;opacity:.8;max-width:34em;line-height:1.5}</style></head><body><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=overlay><div id=title>Loading…</div><div id=hint></div></div><script>const canvas=document.getElementById("canvas"),overlay=document.getElementById("overlay"),title=document.getElementById("title"),hint=document.getElementById("hint"),grabbed=new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Tab"]);function start(){overlay.classList.add("hidden"),canvas.focus()}window.addEventListener("keydown",(e=>{grabbed.has(e.code)&&e.preventDefault()}),{passive:!1}),overlay.addEventListener("click",start),canvas.addEventListener("click",(()=>canvas.focus()));var Module={canvas:canvas,print:(...e)=>console.log(e.join(" ")),printErr:(...e)=>console.error(e.join(" ")),setStatus:e=>{if(!e)return title.textContent="Click to start",hint.textContent="Arrow keys drive · P pauses · L cycles lane feasibilty · CTRL removes occlusion layer",overlay.classList.remove("hidden"),void(overlay.style.cursor="pointer");title.textContent=e}}</script><script async src=zdrive_game.js></script></body></html>
