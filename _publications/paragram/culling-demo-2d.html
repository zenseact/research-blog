<div class="paragram-2d" id="paragram-2d">
  <style>
    .paragram-2d {
      width: 100%;
      max-width: 960px;
      margin: 1.5em auto;
      font-size: 0.95em;
    }
    .paragram-2d__panels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6em;
    }
    @media (max-width: 720px) {
      .paragram-2d__panels { grid-template-columns: 1fr; }
    }
    .paragram-2d__panel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .paragram-2d__title {
      text-align: center;
      font-weight: 600;
      font-size: 0.95em;
      margin-bottom: 0.25em;
      color: #333;
    }
    .paragram-2d__canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      touch-action: none;
    }
    .paragram-2d__canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .paragram-2d__canvas-wrap canvas:active { cursor: grabbing; }
    .paragram-2d__badge {
      position: absolute;
      top: 6px; left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75em;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
    }
    .paragram-2d__badge--bad { background: rgba(220, 70, 70, 0.92); color: #fff; }
    .paragram-2d__badge--ok { background: rgba(60, 140, 70, 0.85); color: #fff; }
    .paragram-2d__caption {
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8em;
      color: #555;
      margin-top: 0.35em;
      min-height: 1.4em;
    }
    .paragram-2d__controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6em 1em;
      align-items: center;
      justify-content: center;
      margin-top: 0.9em;
      padding-top: 0.7em;
      border-top: 1px dashed #e0e0e0;
    }
    .paragram-2d__controls label {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      cursor: pointer;
      user-select: none;
    }
    .paragram-2d__k-row {
      display: inline-flex; align-items: center; gap: 0.4em;
      font-size: 0.9em;
    }
    .paragram-2d__k-row input[type="range"] { width: 140px; }
    .paragram-2d__btn {
      padding: 0.3em 0.9em;
      border: 1px solid #c0c0c0;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9em;
    }
    .paragram-2d__btn:hover { background: #f0f0f0; }
    .paragram-2d__hint {
      text-align: center;
      font-size: 0.85em;
      color: #777;
      margin-top: 0.4em;
      font-style: italic;
    }
    .paragram-2d__legend {
      display: flex; flex-wrap: wrap; gap: 0.7em 1.2em;
      justify-content: center; margin-top: 0.5em;
      font-size: 0.78em; color: #555;
    }
    .paragram-2d__legend span::before {
      content: ''; display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; margin-right: 0.35em; vertical-align: middle;
    }
    .paragram-2d__legend .lg-binding::before { background: #2e7036; }
    .paragram-2d__legend .lg-admitted::before { background: #c87030; }
    .paragram-2d__legend .lg-missed::before   { background: #cc3030; }
    .paragram-2d__legend .lg-other::before    { background: #b8b8b8; }

    .paragram-2d__tabs {
      display: flex; flex-wrap: wrap; gap: 0.4em;
      justify-content: center;
      margin: 0 0 0.7em;
    }
    .paragram-2d__tab {
      padding: 0.3em 0.85em;
      border: 1px solid #c5c5c5;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85em;
      color: #444;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .paragram-2d__tab:hover { background: #f3f3f3; }
    .paragram-2d__tab.is-active {
      background: #d57000; border-color: #d57000; color: #fff;
    }

    .paragram-2d__playback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6em;
      margin-top: 0.7em;
      padding-top: 0.7em;
      border-top: 1px dashed #e0e0e0;
    }
    .paragram-2d__playback input[type="range"] {
      flex: 1; min-width: 140px;
    }
    .paragram-2d__playback-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85em;
      color: #555;
      min-width: 90px;
      text-align: right;
    }
  </style>

  <div class="paragram-2d__tabs" role="tablist" aria-label="point distribution">
    <button class="paragram-2d__tab is-active" data-dist="anisotropic" type="button">anisotropic</button>
    <button class="paragram-2d__tab" data-dist="elongated" type="button">elongated cell</button>
    <button class="paragram-2d__tab" data-dist="surface" type="button">surface</button>
  </div>

  <div class="paragram-2d__panels">
    <div class="paragram-2d__panel">
      <div class="paragram-2d__title">k-nearest neighbors</div>
      <div class="paragram-2d__canvas-wrap">
        <canvas id="paragram-2d-canvas-knn"></canvas>
        <div class="paragram-2d__badge" id="paragram-2d-knn-badge"></div>
      </div>
      <div class="paragram-2d__caption" id="paragram-2d-knn-cap"></div>
    </div>

    <div class="paragram-2d__panel">
      <div class="paragram-2d__title">isotropic bound</div>
      <div class="paragram-2d__canvas-wrap">
        <canvas id="paragram-2d-canvas-iso"></canvas>
        <div class="paragram-2d__badge" id="paragram-2d-iso-badge"></div>
      </div>
      <div class="paragram-2d__caption" id="paragram-2d-iso-cap"></div>
    </div>

    <div class="paragram-2d__panel">
      <div class="paragram-2d__title">directional bound <span style="color:#d57000">(ours)</span></div>
      <div class="paragram-2d__canvas-wrap">
        <canvas id="paragram-2d-canvas-dir"></canvas>
        <div class="paragram-2d__badge" id="paragram-2d-dir-badge"></div>
      </div>
      <div class="paragram-2d__caption" id="paragram-2d-dir-cap"></div>
    </div>
  </div>

  <div class="paragram-2d__legend">
    <span class="lg-binding">true neighbor (binding)</span>
    <span class="lg-admitted">admitted but not binding</span>
    <span class="lg-missed">true neighbor missed</span>
    <span class="lg-other">discarded</span>
  </div>

  <div class="paragram-2d__playback">
    <button class="paragram-2d__btn" id="paragram-2d-play">▶ play</button>
    <input type="range" id="paragram-2d-step" min="0" max="0" step="1" value="0">
    <span class="paragram-2d__playback-label" id="paragram-2d-step-val">step 0 / 0</span>
  </div>

  <div class="paragram-2d__controls">
    <span class="paragram-2d__k-row">
      k =
      <input type="range" id="paragram-2d-k" min="1" max="32" step="1" value="6">
      <span id="paragram-2d-k-val">6</span>
    </span>
    <label><input type="checkbox" id="paragram-2d-show-bisectors"> bisecting lines</label>
    <button class="paragram-2d__btn" id="paragram-2d-reset">reset positions</button>
  </div>

  <p class="paragram-2d__hint">Drag any point — panels stay in sync. Press <em>play</em> or scrub the slider to step through each strategy.</p>
</div>

<script src="culling-demo-2d.js"></script>
