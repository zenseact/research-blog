<!-- Styles and script for the .j3pa-stage-player divs in j3pa.md; include after the last player. -->

<style>
/* Shared by stage-video.html and pca-viewer.html. The player is a size container: when wide, the button bars float
   over the media; when narrow (phones), they become rows above and below it so buttons never overlap the content or
   each other. */
.j3pa-stage-player,
.j3pa-pca-viewer {
  container-type: inline-size;
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  margin: 1em 0;
  background: #fff;
  border-radius: var(--radius);
  overflow: hidden;
}
.j3pa-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
}
.j3pa-stage-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
}
.j3pa-stage-video.is-visible { opacity: 1; }
.j3pa-stage-loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  padding: 0.3em 0.8em;
  border: none;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.85);
  color: #6B7280;
  font: inherit;
  font-size: 0.8rem;
  white-space: nowrap;
}
.j3pa-stage-loading.is-action {
  color: #fff;
  background: rgba(0, 0, 0, 0.7);
  cursor: pointer;
}
.j3pa-bar {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4em;
  padding: 0.6em;
  pointer-events: none;
}
.j3pa-bar.top { top: 0; }
.j3pa-bar.bottom { bottom: 0; }
.j3pa-bar:empty { display: none; }
.j3pa-group {
  display: flex;
  align-items: center;
  gap: 0.4em;
  pointer-events: auto;
}
.j3pa-group.end { margin-left: auto; }
.j3pa-stage-btn,
.j3pa-stage-arrow {
  color: #fff;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(0, 0, 0, 0.2);
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.j3pa-stage-btn {
  padding: 0.4em 0.95em;
  font-size: 0.9rem;
  line-height: 1.2;
  white-space: nowrap;
}
.j3pa-stage-btn:hover,
.j3pa-stage-arrow:hover { background: rgba(0, 0, 0, 0.7); }
.j3pa-stage-btn.active {
  background: #000;
  border-color: #000;
}
.j3pa-stage-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
.j3pa-stage-btn:disabled:hover { background: rgba(0, 0, 0, 0.45); }
.j3pa-stage-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
  padding: 0 0.2em;
  font-size: 3rem;
  line-height: 1;
  color: #000;
  background: none;
  border: none;
  text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px #fff;
  opacity: 0.85;
}
.j3pa-stage-arrow:hover {
  background: none;
  opacity: 1;
}
.j3pa-stage-arrow.prev { left: 0.3em; }
.j3pa-stage-arrow.next { right: 0.3em; }
.j3pa-stage-btn:focus,
.j3pa-stage-arrow:focus,
.j3pa-stage-dot:focus {
  outline: none;
  box-shadow: none;
}
.j3pa-stage-btn:focus-visible,
.j3pa-stage-arrow:focus-visible,
.j3pa-stage-dot:focus-visible {
  outline: 2px solid #E6007E;
  outline-offset: 2px;
}
.j3pa-stage-dots {
  position: absolute;
  bottom: 0.6em;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  gap: 0.45em;
}
.j3pa-stage-dot {
  width: 11px;
  height: 11px;
  padding: 0;
  border: 1px solid #000;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
.j3pa-stage-dot.active { background: #000; }

@container (max-width: 600px) {
  .j3pa-bar {
    position: static;
    gap: 0.3em;
    padding: 0.4em 0;
  }
  .j3pa-group { gap: 0.3em; }
  .j3pa-stage-btn {
    min-height: 2.25rem;
    padding: 0.3em 0.65em;
    font-size: 0.8rem;
  }
  .j3pa-stage-arrow { font-size: 2.4rem; }
  .j3pa-stage-dots { bottom: 0.4em; }
  .j3pa-stage-dot {
    width: 13px;
    height: 13px;
  }
}
@container (max-width: 340px) {
  .j3pa-stage-btn {
    padding: 0.3em 0.5em;
    font-size: 0.72rem;
  }
}
</style>

<script>
// Each video is downloaded whole into a blob so stage switches can seek instantly.
// Downloads run one 4 MB range at a time, always for the highest-priority video, so a click preempts preloading.
(function () {
  // onBlocked runs when the browser refuses to autoplay (e.g. iOS Low Power Mode) and needs a tap first.
  function play(v, onBlocked) {
    var p = v.play();
    if (p && p.catch) {
      p.catch(function (err) {
        if (onBlocked && err && err.name === 'NotAllowedError') onBlocked(v);
      });
    }
  }

  // Calls cb once v has a decoded frame at its current position. iOS Safari only loads metadata for paused videos,
  // so callers must play() the video first rather than wait for loadeddata.
  function whenFrame(v, cb) {
    var events = ['loadeddata', 'canplay', 'playing', 'seeked', 'timeupdate'];
    function check() {
      if (v.seeking || v.readyState < 2) return;
      events.forEach(function (e) { v.removeEventListener(e, check); });
      cb();
    }
    events.forEach(function (e) { v.addEventListener(e, check); });
    check();
  }

  var downloader = (function () {
    var CHUNK = 4 << 20;
    // The local Jekyll server answers cached range revalidations with an invalid 304.
    var cacheMode = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'no-store' : 'default';
    var jobs = {};
    var order = 0;
    var busy = false;

    function pump() {
      if (busy) return;
      var job = null;
      Object.keys(jobs).forEach(function (url) {
        var j = jobs[url];
        if (!job || j.priority < job.priority || (j.priority === job.priority && j.order < job.order)) job = j;
      });
      if (!job) return;
      busy = true;
      var headers = job.whole ? {} : { Range: 'bytes=' + job.offset + '-' + (job.offset + CHUNK - 1) };
      fetch(job.url, { headers: headers, cache: cacheMode })
        .then(function (r) {
          var range = r.headers.get('Content-Range');
          if (r.status === 206 && range) {
            job.total = parseInt(range.split('/')[1], 10);
          } else if (r.status === 206) {
            // The total size is unreadable (header not exposed through the CDN redirect): fetch the whole file.
            job.whole = true;
            return null;
          } else if (r.ok) {
            job.parts = [];
            job.offset = 0;
            job.total = null;
          } else {
            throw new Error('HTTP ' + r.status);
          }
          return r.arrayBuffer();
        })
        .then(function (buf) {
          if (!buf) return;
          job.parts.push(buf);
          job.offset += buf.byteLength;
          if (job.total === null) job.total = job.offset;
          if (job.onProgress) job.onProgress(job.offset / job.total);
          if (job.offset >= job.total) {
            delete jobs[job.url];
            job.done = true;
            job.resolve(new Blob(job.parts));
          }
        })
        .catch(function (err) {
          delete jobs[job.url];
          job.done = true;
          job.reject(err);
        })
        .then(function () {
          busy = false;
          pump();
        });
    }

    // Lower priority value downloads first; calling again for the same URL can only raise its priority.
    function get(url, priority) {
      var job = jobs[url];
      if (!job) {
        job = jobs[url] = { url: url, priority: priority, order: order++, parts: [], offset: 0, total: null };
        job.promise = new Promise(function (resolve, reject) {
          job.resolve = resolve;
          job.reject = reject;
        });
      } else if (priority < job.priority) {
        job.priority = priority;
      }
      pump();
      return job;
    }

    var clickPriority = 0;

    // Clicks get ever lower values, so the latest click always downloads first.
    function urgent() {
      return --clickPriority;
    }

    return { get: get, urgent: urgent };
  })();
  window.j3paDownloader = downloader;

  // Clickable position dots for players with several pages; returns a function that marks page i as current.
  window.j3paDots = function (root, count, label, onSelect) {
    if (count < 2) return function () {};
    var wrap = document.createElement('div');
    wrap.className = 'j3pa-stage-dots';
    var dots = [];
    for (var i = 0; i < count; i++) {
      var d = document.createElement('button');
      d.type = 'button';
      d.className = 'j3pa-stage-dot';
      d.setAttribute('aria-label', label + ' ' + (i + 1));
      d.addEventListener('click', onSelect.bind(null, i));
      wrap.appendChild(d);
      dots.push(d);
    }
    root.appendChild(wrap);
    return function (current) {
      dots.forEach(function (d, i) { d.classList.toggle('active', i === current); });
    };
  };

  // Splits a player into a top button bar, the media box and a bottom button bar; see the CSS above for how the bars
  // float over the media on wide players and stack around it on narrow ones.
  window.j3paLayout = function (root) {
    function bar(cls) {
      var b = document.createElement('div');
      b.className = 'j3pa-bar ' + cls;
      return b;
    }
    var top = bar('top');
    var media = document.createElement('div');
    media.className = 'j3pa-media';
    var bottom = bar('bottom');
    root.appendChild(top);
    root.appendChild(media);
    root.appendChild(bottom);
    return {
      media: media,
      // Groups are laid out in creation order; `end` pushes a group (and those after it) to the right.
      group: function (where, end) {
        var g = document.createElement('div');
        g.className = 'j3pa-group' + (end ? ' end' : '');
        (where === 'bottom' ? bottom : top).appendChild(g);
        return g;
      }
    };
  };

  function initPlayer(player) {
    // data-variants: [{name, dir, stages?}], stages listing the indices that exist (default: all); else one data-dir.
    var variants = player.dataset.variants ? JSON.parse(player.dataset.variants) : [{ dir: player.dataset.dir }];
    var sequences = player.dataset.sequences.split(',');
    var nStages = parseInt(player.dataset.stages, 10);
    var seq = 0;
    var variant = 0;
    var shownVariant = 0;
    var stage = nStages - 2;
    var targetKey = null;
    var active = null;
    var loads = {};
    var jobsByKey = {};
    var videos = {};

    var layout = window.j3paLayout(player);
    var media = layout.media;
    var variantGroup = variants.length > 1 ? layout.group('top') : null;
    var stageGroup = layout.group('top', true);

    var loading = document.createElement('div');
    loading.className = 'j3pa-stage-loading';
    loading.textContent = 'Loading video\u2026';
    loading.addEventListener('click', function () {
      if (!loading.classList.contains('is-action')) return;
      loading.classList.remove('is-action');
      loading.textContent = 'Loading video\u2026';
      var v = videos[targetKey] || active;
      if (v) play(v, blocked);
    });
    media.appendChild(loading);

    function blocked(v) {
      if (v.dataset.key !== targetKey) return;
      loading.textContent = '\u25B6 Tap to play';
      loading.classList.add('is-action');
      loading.style.display = '';
    }

    var buttons = [];
    for (var s = 0; s < nStages; s++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'j3pa-stage-btn';
      b.textContent = 'S' + (s + 1);
      b.addEventListener('click', (function (s) {
        return function () { show(seq, s, downloader.urgent()); };
      })(s));
      stageGroup.appendChild(b);
      buttons.push(b);
    }

    function hasStage(vi, s) {
      return !variants[vi].stages || variants[vi].stages.indexOf(s) >= 0;
    }

    var variantButtons = [];
    if (variantGroup) {
      variants.forEach(function (vr, vi) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'j3pa-stage-btn';
        b.textContent = vr.name;
        b.addEventListener('click', function () {
          variant = vi;
          var s = stage;
          for (var d = 1; !hasStage(vi, s) && d < nStages; d++) {
            if (hasStage(vi, stage + d)) s = stage + d;
            else if (hasStage(vi, stage - d)) s = stage - d;
          }
          show(seq, s, downloader.urgent());
        });
        variantGroup.appendChild(b);
        variantButtons.push(b);
      });
    }

    function arrow(cls, label, text, delta) {
      var a = document.createElement('button');
      a.type = 'button';
      a.className = 'j3pa-stage-arrow ' + cls;
      a.setAttribute('aria-label', label);
      a.textContent = text;
      a.addEventListener('click', function () { show(seq + delta, stage, downloader.urgent()); });
      media.appendChild(a);
      return a;
    }
    var prev = arrow('prev', 'Previous sequence', '\u2039', -1);
    var next = arrow('next', 'Next sequence', '\u203A', 1);
    var dots = window.j3paDots(media, sequences.length, 'Sequence', function (q) {
      show(q, stage, downloader.urgent());
    });

    function key(q, s, vi) {
      return variants[vi === undefined ? variant : vi].dir + '/' + sequences[q] + '_s' + s;
    }

    function setLoadingText(k, frac) {
      if (targetKey !== k || videos[k]) return;
      loading.textContent = 'Loading video\u2026 ' + Math.round(frac * 100) + '%';
    }

    // Resolves with the video element as soon as its file is downloaded. Nothing waits for media events here: iOS
    // Safari loads no media data (not even metadata) for a video until play() is called, so show() plays first and
    // reveals the video once a frame is decoded.
    function load(k, priority) {
      var job = jobsByKey[k];
      if (!loads[k]) {
        job = jobsByKey[k] = downloader.get(k + '.mp4', priority);
        job.onProgress = setLoadingText.bind(null, k);
        loads[k] = job.promise.then(function (blob) {
          var v = document.createElement('video');
          v.className = 'j3pa-stage-video';
          v.dataset.key = k;
          v.dataset.seq = k.split('/').pop().split('_s')[0];
          v.muted = true;
          v.defaultMuted = true;
          v.loop = true;
          v.playsInline = true;
          v.disablePictureInPicture = true;
          v.setAttribute('muted', '');
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
          v.setAttribute('disableremoteplayback', '');
          v.preload = 'auto';
          v.addEventListener('pause', function () {
            if (v === active && !document.hidden) play(v, blocked);
          });
          v.addEventListener('playing', function () {
            if (v === active && v.dataset.key === targetKey) {
              loading.classList.remove('is-action');
              loading.style.display = 'none';
            }
          });
          v.addEventListener('error', function () {
            v.dataset.failed = '1';
            if (targetKey === k) {
              loading.classList.remove('is-action');
              loading.textContent = 'Video failed to load.';
              loading.style.display = '';
            }
          });
          v.src = URL.createObjectURL(new Blob([blob], { type: 'video/mp4' }));
          media.insertBefore(v, loading);
          videos[k] = v;
          return v;
        });
      } else if (job && !job.done) {
        downloader.get(job.url, priority);
      }
      return loads[k];
    }

    // Nearest stages of the current sequence and variant first, then the other variants' same stage, then the same
    // stage of the neighbouring sequences.
    function preload(q) {
      for (var d = 1; d < nStages; d++) {
        [stage + d, stage - d].forEach(function (s) {
          if (s >= 0 && s < nStages && hasStage(variant, s)) load(key(q, s), 2 + d / 100).catch(function () {});
        });
      }
      variants.forEach(function (vr, vi) {
        if (vi !== variant && hasStage(vi, stage)) load(key(q, stage, vi), 2.5).catch(function () {});
      });
      [q + 1, q - 1].forEach(function (n) {
        if (n >= 0 && n < sequences.length) load(key(n, stage), 3).catch(function () {});
      });
    }

    function reveal(v) {
      var old = active;
      active = v;
      v.classList.add('is-visible');
      if (old && old !== v) {
        old.classList.remove('is-visible');
        old.pause();
      }
      if (!v.paused) loading.classList.remove('is-action');
      if (!loading.classList.contains('is-action')) loading.style.display = 'none';
    }

    function show(q, s, priority) {
      var sameSeq = active && active.dataset.seq === sequences[q];
      var seqChanged = q !== seq || variant !== shownVariant;
      shownVariant = variant;
      seq = q;
      stage = s;
      var k = key(q, s);
      targetKey = k;
      buttons.forEach(function (b, i) {
        b.classList.toggle('active', i === s);
        b.disabled = !hasStage(variant, i);
      });
      variantButtons.forEach(function (b, vi) { b.classList.toggle('active', vi === variant); });
      prev.style.display = q > 0 ? '' : 'none';
      next.style.display = q < sequences.length - 1 ? '' : 'none';
      dots(q);
      loading.classList.remove('is-action');
      if (!videos[k]) {
        loading.textContent = 'Loading video\u2026';
        loading.style.display = '';
      } else if (videos[k] !== active) {
        // Still inside the click, so browsers that require a gesture to start playback allow it.
        play(videos[k], blocked);
      }

      load(k, priority).then(function (v) {
        if (targetKey !== k || v === active || v.dataset.failed) return;
        var t = sameSeq ? active.currentTime : 0;
        play(v, blocked);
        if (Math.abs(v.currentTime - t) > 0.05) v.currentTime = t;
        whenFrame(v, function () {
          if (targetKey === k) {
            if (v !== active) reveal(v);
          } else if (v !== active) {
            v.pause();
          }
        });
        // Fallback for browsers that hold playback without reporting it as blocked: a tap is always allowed to play.
        setTimeout(function () {
          if (targetKey === k && (v !== active || v.paused) && !v.dataset.failed && !loading.classList.contains('is-action')) {
            blocked(v);
          }
        }, 6000);
      }).catch(function () {
        if (targetKey === k) loading.textContent = 'Video failed to load.';
      });
      if (seqChanged || !active) preload(q);
    }

    show(0, stage, 1);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && active) play(active, blocked);
    });
  }

  document.querySelectorAll('.j3pa-stage-player').forEach(initPlayer);
})();
</script>
